<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e0b" />
    <meta
      name="description"
      content="Don Padrino Pizzaria. Pizzas artesanais de 35 cm, 8 fatias. Escolha sua pizza, peça sem cadastro e acompanhe seu pedido."
    />
    <title>Don Padrino — Pizzaria</title>
    <link rel="icon" type="image/webp" href="/assets/logo.webp" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="preload" as="image" href="/assets/calabresa-hd.webp" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <header class="header">
      <a class="brand" href="/" aria-label="Don Padrino, início"
        ><img src="/assets/logo.webp" width="64" height="64" alt="" /><span
          ><strong>DON PADRINO</strong><small>PIZZARIA</small></span
        ></a
      >
      <nav class="desktop-nav" aria-label="Navegação principal">
        <a href="/#cardapio">CARDÁPIO</a><a href="/#informacoes">INFORMAÇÕES</a>
      </nav>
      <button class="cart-trigger outline" data-action="cart">
        <span>MEU PEDIDO</span><b id="cart-count">0</b>
      </button>
      <button
        class="menu-toggle icon-button"
        data-action="menu"
        aria-label="Abrir menu"
        aria-expanded="false"
      >
        <span></span><span></span>
      </button>
    </header>
    <div
      id="store-availability"
      class="store-availability"
      hidden
      role="status"
      aria-live="polite"
    >
      <span class="availability-dot" aria-hidden="true"></span>
      <span id="availability-label"></span>
      <a href="/#informacoes">Horários</a>
    </div>
    <main id="main">
      <div class="initial-loader" role="status">
        Preparando o cardápio<span></span>
      </div>
    </main>
    <footer class="footer">
      <span>DON PADRINO <i>/</i> PIZZARIA</span
      ><span>CNPJ 68.686.833/0001-91</span>
    </footer>
    <nav class="mobile-nav" aria-label="Navegação mobile">
      <a href="/" data-tab="home">Início</a
      ><a href="/#cardapio" data-tab="menu">Cardápio</a
      ><button data-action="cart" data-tab="cart">
        Pedido <span id="mobile-cart-count"></span></button
      ><a
        href="https://wa.me/5521994568096"
        target="_blank"
        rel="noopener noreferrer"
        data-tab="chat"
        >WhatsApp</a
      >
    </nav>
    <div id="overlay-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
